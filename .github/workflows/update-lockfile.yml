name: Update pnpm lockfile

on:
  push:
    branches: [chore/production-quality-gates]
    paths:
      - packages/api-server/package.json
      - packages/db/package.json
      - .github/workflows/update-lockfile.yml

permissions:
  contents: write

jobs:
  update-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Refresh lockfile
        run: pnpm install --lockfile-only

      - name: Commit lockfile if changed
        run: |
          git diff --quiet pnpm-lock.yaml && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh pnpm lockfile"
          git push

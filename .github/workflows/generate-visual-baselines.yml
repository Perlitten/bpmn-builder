# One-time cloud-only visual baseline generation.
name: Generate visual baselines

on:
  push:
    branches: [chore/production-quality-gates]
    paths:
      - e2e/visual.spec.ts
      - .github/workflows/generate-visual-baselines.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.14.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Generate Linux screenshot baselines
        env:
          ENABLE_TEST_AUTH: 'true'
          NODE_ENV: 'test'
          DB_PROVIDER: 'sqlite'
          DATABASE_URL: 'file:./data/visual.db'
          SESSION_SECRET: 'visual-test-session-secret-at-least-16-chars'
        run: pnpm exec playwright test e2e/visual.spec.ts --update-snapshots

      - name: Commit visual baselines
        run: |
          git add -- e2e/visual.spec.ts-snapshots
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(e2e): add Linux visual baselines"
          git push
